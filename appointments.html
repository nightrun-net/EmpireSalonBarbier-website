<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rendez-vous clients</title>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
>

<style>
*{
    box-sizing:border-box;
}

html,
body{
    width:100%;
    margin:0;
    padding:0;
}

body{
    padding:20px;
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    color:#222;
}

/* =========================
   MAIN CONTAINER
========================= */

.container{
    width:100%;
    max-width:1200px;
    margin:auto;
    padding:25px;
    background:#fff;
    border-radius:15px;
    box-shadow:0 5px 25px rgba(0,0,0,.08);
}

/* =========================
   HEADER
========================= */

.header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    margin-bottom:20px;
}

.header h2{
    margin:0;
    font-size:27px;
}

.back-btn{
    min-height:44px;
    padding:11px 16px;
    border:none;
    border-radius:9px;
    background:#ffc107;
    color:#111;
    cursor:pointer;
    font-weight:bold;
    font-size:14px;
    transition:.2s ease;
}

.back-btn:hover{
    background:#e0a800;
}

/* =========================
   COUNT
========================= */

.appointment-count{
    margin:0 0 20px;
    color:#555;
    font-size:17px;
}

/* =========================
   CONTROLS
========================= */

.controls{
    display:flex;
    align-items:center;
    flex-wrap:wrap;
    gap:10px;
    margin-bottom:20px;
}

input{
    min-height:44px;
    padding:10px 12px;
    border:1px solid #ddd;
    border-radius:9px;
    outline:none;
    background:#fff;
    font-size:14px;
}

input:focus{
    border-color:#007bff;
    box-shadow:0 0 0 3px rgba(0,123,255,.08);
}

#liveSearch{
    flex:1;
    min-width:220px;
}

button{
    min-height:44px;
    padding:9px 14px;
    border:none;
    border-radius:9px;
    cursor:pointer;
    font-size:14px;
    transition:.2s ease;
}

button:hover{
    opacity:.88;
}

.refresh-btn{
    background:#28a745;
    color:#fff;
}

.delete-month-btn{
    background:#dc3545;
    color:#fff;
    font-weight:bold;
}

/* =========================
   MONTH WARNING
========================= */

.month-danger{
    width:100%;
    margin-top:5px;
    margin-bottom:15px;
    padding:11px 13px;
    display:none;
    border-radius:9px;
    background:#fff3f3;
    border:1px solid #ffd0d0;
    color:#b52020;
    font-size:12px;
    line-height:1.6;
}

.month-danger.show{
    display:block;
}

/* =========================
   TABLE
========================= */

.table-container{
    width:100%;
    border:1px solid #e3e3e3;
    border-radius:12px;
    overflow:hidden;
    background:#fff;
}

.table-scroll{
    width:100%;
    max-height:770px;
    overflow:auto;
    overscroll-behavior:contain;
    scrollbar-width:thin;
    scrollbar-color:#007bff #eee;
}

.table-scroll::-webkit-scrollbar{
    width:8px;
    height:8px;
}

.table-scroll::-webkit-scrollbar-track{
    background:#eee;
}

.table-scroll::-webkit-scrollbar-thumb{
    background:#007bff;
    border-radius:20px;
}

table{
    width:100%;
    min-width:790px;
    border-collapse:separate;
    border-spacing:0;
    table-layout:fixed;
}

thead{
    background:#007bff;
}

th{
    position:sticky;
    top:0;
    z-index:5;
    height:50px;
    padding:10px 12px;
    background:#007bff;
    color:#fff;
    font-size:13px;
    font-weight:600;
    text-align:center;
    white-space:nowrap;
    border-right:1px solid rgba(255,255,255,.18);
}

td{
    height:48px;
    padding:9px 12px;
    border-bottom:1px solid #eee;
    border-right:1px solid #eee;
    text-align:center;
    font-size:13px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

th:last-child,
td:last-child{
    border-right:none;
}

tbody tr:nth-child(even){
    background:#fafafa;
}

tbody tr:hover{
    background:#f1f7ff;
}

tbody tr:last-child td{
    border-bottom:none;
}

/* =========================
   COLUMN WIDTHS
========================= */

th:nth-child(1),
td:nth-child(1){
    width:50px;
}

th:nth-child(2),
td:nth-child(2){
    width:155px;
}

th:nth-child(3),
td:nth-child(3){
    width:135px;
}

th:nth-child(4),
td:nth-child(4){
    width:110px;
}

th:nth-child(5),
td:nth-child(5){
    width:85px;
}

th:nth-child(6),
td:nth-child(6){
    width:125px;
}

th:nth-child(7),
td:nth-child(7){
    width:150px;
}

/* Small action column */

th:nth-child(8),
td:nth-child(8){
    width:52px;
    padding-left:5px;
    padding-right:5px;
}

/* =========================
   DELETE ICON
========================= */

.delete-btn{
    width:32px;
    min-width:32px;
    height:32px;
    min-height:32px;
    padding:0;
    margin:auto;

    display:flex;
    align-items:center;
    justify-content:center;

    border:none;
    border-radius:7px;

    background:#dc3545;
    color:#fff;

    font-size:13px;

    cursor:pointer;

    transition:
        background .2s ease,
        transform .2s ease;
}

.delete-btn:hover{
    background:#bd2130;
    transform:scale(1.06);
    opacity:1;
}

.delete-btn i{
    pointer-events:none;
}

/* =========================
   EMPTY
========================= */

.empty-row{
    height:100px;
    color:#888;
    text-align:center;
}

/* =========================
   TABLET
========================= */

@media(max-width:900px){

    body{
        padding:12px;
    }

    .container{
        padding:16px;
        border-radius:12px;
    }

    .header h2{
        font-size:23px;
    }

    table{
        min-width:700px;
    }

    th,
    td{
        padding:8px 6px;
        font-size:12px;
    }

    th:nth-child(1),
    td:nth-child(1){
        width:42px;
    }

    th:nth-child(2),
    td:nth-child(2){
        width:120px;
    }

    th:nth-child(3),
    td:nth-child(3){
        width:110px;
    }

    th:nth-child(4),
    td:nth-child(4){
        width:90px;
    }

    th:nth-child(5),
    td:nth-child(5){
        width:68px;
    }

    th:nth-child(6),
    td:nth-child(6){
        width:100px;
    }

    th:nth-child(7),
    td:nth-child(7){
        width:115px;
    }

    th:nth-child(8),
    td:nth-child(8){
        width:48px;
        padding-left:4px;
        padding-right:4px;
    }

    .delete-btn{
        width:30px;
        min-width:30px;
        height:30px;
        min-height:30px;
        font-size:12px;
    }
}

/* =========================
   MOBILE
   REAL GRID / TABLE
========================= */

@media(max-width:700px){

    body{
        padding:7px;
        background:#f4f5f7;
    }

    .container{
        width:100%;
        padding:10px;
        border-radius:10px;
        box-shadow:none;
    }

    /* Header */

    .header{
        display:grid;
        grid-template-columns:1fr;
        gap:10px;
        margin-bottom:14px;
    }

    .header h2{
        order:1;
        text-align:center;
        font-size:20px;
    }

    .back-btn{
        order:2;
        width:100%;
        min-height:42px;
        font-size:13px;
    }

    /* Counter */

    .appointment-count{
        margin-bottom:13px;
        text-align:center;
        font-size:15px;
    }

    /* Controls */

    .controls{
        display:grid;
        grid-template-columns:1fr 1fr;
        gap:7px;
        margin-bottom:13px;
    }

    #liveSearch{
        grid-column:1 / -1;
        width:100%;
        min-width:0;
    }

    #monthPicker{
        width:100%;
        min-width:0;
    }

    .refresh-btn{
        width:100%;
    }

    .delete-month-btn{
        grid-column:1 / -1;
        width:100%;
    }

    input,
    button{
        min-height:42px;
        font-size:13px;
    }

    /* Table */

    .table-container{
        width:100%;
        border-radius:8px;
        overflow:hidden;
    }

    .table-scroll{
        width:100%;
        max-height:650px;

        overflow-x:auto;
        overflow-y:auto;

        -webkit-overflow-scrolling:touch;
    }

    table{
        width:100%;
        min-width:590px;
        table-layout:fixed;
    }

    th{
        height:44px;
        padding:5px 3px;
        font-size:10px;
    }

    td{
        height:43px;
        padding:5px 3px;
        font-size:10px;
    }

    th:nth-child(1),
    td:nth-child(1){
        width:33px;
    }

    th:nth-child(2),
    td:nth-child(2){
        width:98px;
    }

    th:nth-child(3),
    td:nth-child(3){
        width:90px;
    }

    th:nth-child(4),
    td:nth-child(4){
        width:75px;
    }

    th:nth-child(5),
    td:nth-child(5){
        width:53px;
    }

    th:nth-child(6),
    td:nth-child(6){
        width:75px;
    }

    th:nth-child(7),
    td:nth-child(7){
        width:105px;
    }

    th:nth-child(8),
    td:nth-child(8){
        width:42px;
        padding-left:2px;
        padding-right:2px;
    }

    .delete-btn{
        width:27px;
        min-width:27px;
        height:27px;
        min-height:27px;
        padding:0;
        border-radius:5px;
        font-size:10px;
    }

    .month-danger{
        font-size:11px;
    }
}

/* =========================
   SMALL MOBILE
========================= */

@media(max-width:480px){

    body{
        padding:4px;
    }

    .container{
        padding:7px;
        border-radius:8px;
    }

    .header{
        gap:7px;
    }

    .header h2{
        font-size:18px;
    }

    .appointment-count{
        font-size:14px;
    }

    .controls{
        grid-template-columns:1fr;
    }

    #liveSearch,
    #monthPicker,

    .delete-month-btn{

    }

    table{
        min-width:550px;
    }

    th{
        height:40px;
        padding:4px 2px;
        font-size:9px;
    }

    td{
        height:40px;
        padding:4px 2px;
        font-size:9px;
    }

    th:nth-child(1),
    td:nth-child(1){
        width:28px;
    }

    th:nth-child(2),
    td:nth-child(2){
        width:85px;
    }

    th:nth-child(3),
    td:nth-child(3){
        width:82px;
    }

    th:nth-child(4),
    td:nth-child(4){
        width:70px;
    }

    th:nth-child(5),
    td:nth-child(5){
        width:47px;
    }

    th:nth-child(6),
    td:nth-child(6){
        width:67px;
    }

    th:nth-child(7),
    td:nth-child(7){
        width:95px;
    }

    th:nth-child(8),
    td:nth-child(8){
        width:37px;
        padding-left:1px;
        padding-right:1px;
    }

    .delete-btn{
        width:24px;

</style>
</head>

<body>

<div class="container">

    <div class="header">

        <button
            class="back-btn"
            onclick="goBack()"
        >
            ← Retour au tableau de bord
        </button>

        <h2>
            Rendez-vous clients
        </h2>

    </div>

    <h3
        id="appointmentCount"
        class="appointment-count"
    >
        Total des rendez-vous : 0
    </h3>

    <div class="controls">

        <input
            type="text"
            id="liveSearch"
            placeholder="Recherche : nom, téléphone, date, barbier..."
        >

        <input
            type="month"
            id="monthPicker"
        >

        <button
            class="refresh-btn"
            onclick="fetchAppointments()"
        >
            Actualiser
        </button>

        <button
            class="delete-month-btn"
            onclick="deleteSelectedMonth()"
        >
            Supprimer le mois
        </button>

    </div>

    <div
        id="monthDanger"
        class="month-danger"
    ></div>

    <div class="table-container">

        <div
            class="table-scroll"
            id="tableScroll"
        >

            <table>

                <thead>
                    <tr>
                        <th>#</th>
                        <th>Nom</th>
                        <th>Mobile</th>
                        <th>Date</th>
                        <th>Heure</th>
                        <th>Barbier</th>
                        <th>Service</th>
                        <th>
                            <i class="fa-solid fa-gear"></i>
                        </th>
                    </tr>
                </thead>

                <tbody id="appointmentsBody">

                    <tr>
                        <td
                            colspan="8"
                            class="empty-row"
                        >
                            Chargement...
                        </td>
                    </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>

<script>
/* =========================
   FIREBASE
========================= */

firebase.initializeApp({

    apiKey:
        "AIzaSyDtfwLl6xJxYJrgBMUGTlnyH1Ks9E5LOQs",

    authDomain:
        "empiresalonbarber.firebaseapp.com",

    databaseURL:
        "https://empiresalonbarber-default-rtdb.europe-west1.firebasedatabase.app/",

    projectId:
        "empiresalonbarber",

    storageBucket:
        "empiresalonbarber.appspot.com",

    messagingSenderId:
        "365303178903",

    appId:
        "1:365303178903:web:c6f9eb19766934e443ebd2",

    measurementId:
        "G-LMHTQJBCP6"
});

const db =
    firebase.database();

let allAppointments =
    [];

/* =========================
   COUNTER
========================= */

function updateCounter(num){

    document
        .getElementById(
            "appointmentCount"
        )
        .innerText =
            "Total des rendez-vous : " + num;
}

/* =========================
   FETCH
========================= */

function fetchAppointments(){

    const body =
        document.getElementById(
            "appointmentsBody"
        );

    body.innerHTML = `
        <tr>
            <td
                colspan="8"
                class="empty-row"
            >
                Chargement...
            </td>
        </tr>
    `;

    db.ref("bookings")
        .once("value")
        .then(snapshot => {

            if(!snapshot.exists()){

                allAppointments = [];

                updateCounter(0);

                body.innerHTML = `
                    <tr>
                        <td
                            colspan="8"
                            class="empty-row"
                        >
                            Aucun rendez-vous.
                        </td>
                    </tr>
                `;

                return;
            }

            const appointments =
                [];

            snapshot.forEach(child => {

                const data =
                    child.val() || {};

                if(
                    !data.date ||
                    !data.time
                ){
                    return;
                }

                const d =
                    String(
                        data.date
                    ).split("-");

                const t =
                    String(
                        data.time
                    ).split(":");

                if(
                    d.length !== 3 ||
                    t.length !== 2
                ){
                    return;
                }

                const day =
                    Number(d[0]);

                const month =
                    Number(d[1]);

                const year =
                    Number(d[2]);

                const hour =
                    Number(t[0]);

                const minute =
                    Number(t[1]);

                const fullDate =
                    new Date(
                        year,
                        month - 1,
                        day,
                        hour,
                        minute
                    );

                appointments.push({

                    id:
                        child.key,

                    username:
                        data.username || "-",

                    mobile:
                        data.mobile || "-",

                    date:
                        data.date,

                    time:
                        data.time,

                    barber:
                        data.barber || "N/A",

                    service:
                        data.service || "-",

                    year:
                        String(year),

                    month:
                        String(month)
                            .padStart(2,"0"),

                    timestamp:
                        fullDate.getTime()

                });

            });

            appointments.sort(
                (a,b) =>
                    b.timestamp -
                    a.timestamp
            );

            allAppointments =
                appointments;

            applyFilters();

        })
        .catch(error => {

            console.error(
                "Firebase error:",
                error
            );

            body.innerHTML = `
                <tr>
                    <td
                        colspan="8"
                        class="empty-row"
                    >
                        Erreur lors du chargement.
                    </td>
                </tr>
            `;

        });
}

/* =========================
   FILTER
========================= */

function applyFilters(){

    const search =
        document
            .getElementById(
                "liveSearch"
            )
            .value
            .trim()
            .toLowerCase();

    const selectedMonth =
        document
            .getElementById(
                "monthPicker"
            )
            .value;

    let filtered =
        [...allAppointments];

    if(selectedMonth){

        const [
            year,
            month
        ] =
            selectedMonth.split("-");

        filtered =
            filtered.filter(
                app =>
                    app.year === year &&
                    app.month === month
            );
    }

    if(search){

        filtered =
            filtered.filter(app => {

                return (

                    String(
                        app.username
                    )
                    .toLowerCase()
                    .includes(search)

                    ||

                    String(
                        app.mobile
                    )
                    .toLowerCase()
                    .includes(search)

                    ||

                    String(
                        app.date
                    )
                    .toLowerCase()
                    .includes(search)

                    ||

                    String(
                        app.time
                    )
                    .toLowerCase()
                    .includes(search)

                    ||

                    String(
                        app.barber
                    )
                    .toLowerCase()
                    .includes(search)

                    ||

                    String(
                        app.service
                    )
                    .toLowerCase()
                    .includes(search)

                );

            });
    }

    updateCounter(
        filtered.length
    );

    renderAppointments(
        filtered
    );

    updateMonthDeleteInfo();
}

/* =========================
   RENDER GRID
========================= */

function renderAppointments(
    appointments
){

    const body =
        document.getElementById(
            "appointmentsBody"
        );

    if(!appointments.length){

        body.innerHTML = `
            <tr>
                <td
                    colspan="8"
                    class="empty-row"
                >
                    Aucun rendez-vous trouvé.
                </td>
            </tr>
        `;

        return;
    }

    body.innerHTML =
        appointments
            .map(
                (app,index) => `
                    <tr>

                        <td>
                            ${index + 1}
                        </td>

                        <td
                            title="${escapeHTML(app.username)}"
                        >
                            ${escapeHTML(app.username)}
                        </td>

                        <td
                            title="${escapeHTML(app.mobile)}"
                        >
                            ${escapeHTML(app.mobile)}
                        </td>

                        <td>
                            ${escapeHTML(app.date)}
                        </td>

                        <td>
                            ${escapeHTML(app.time)}
                        </td>

                        <td
                            title="${escapeHTML(app.barber)}"
                        >
                            <strong>
                                ${escapeHTML(app.barber)}
                            </strong>
                        </td>

                        <td
                            title="${escapeHTML(app.service)}"
                        >
                            ${escapeHTML(app.service)}
                        </td>

                        <td>

                            <button
                                class="delete-btn"
                                onclick="deleteAppointment('${app.id}')"
                                title="Supprimer"
                                aria-label="Supprimer"
                            >
                                <i class="fa-solid fa-trash"></i>
                            </button>

                        </td>

                    </tr>
                `
            )
            .join("");
}

/* =========================
   MONTH DELETE INFO
========================= */

function updateMonthDeleteInfo(){

    const selectedMonth =
        document
            .getElementById(
                "monthPicker"
            )
            .value;

    const box =
        document.getElementById(
            "monthDanger"
        );

    if(!selectedMonth){

        box.classList.remove(
            "show"
        );

        box.innerHTML = "";

        return;
    }

    const [
        year,
        month
    ] =
        selectedMonth.split("-");

    const count =
        allAppointments
            .filter(
                app =>
                    app.year === year &&
                    app.month === month
            )
            .length;

    box.innerHTML = `
        Le mois sélectionné contient
        <strong>${count}</strong>
        rendez-vous.
        Le bouton « Supprimer le mois »
        supprimera définitivement
        ces rendez-vous de Firebase.
    `;

    box.classList.add(
        "show"
    );
}

/* =========================
   DELETE ONE
========================= */

function deleteAppointment(id){

    const confirmed =
        confirm(
            "Supprimer ce rendez-vous ?"
        );

    if(!confirmed){
        return;
    }

    db.ref(
        "bookings/" + id
    )
    .remove()
    .then(() => {

        fetchAppointments();

    })
    .catch(error => {

        console.error(
            error
        );

        alert(
            "Erreur lors de la suppression."
        );

    });
}

/* =========================
   DELETE MONTH
========================= */

function deleteSelectedMonth(){

    const selectedMonth =
        document
            .getElementById(
                "monthPicker"
            )
            .value;

    if(!selectedMonth){

        alert(
            "Veuillez d'abord sélectionner un mois."
        );

        return;
    }

    const [
        year,
        month
    ] =
        selectedMonth.split("-");

    const appointmentsToDelete =
        allAppointments
            .filter(
                app =>
                    app.year === year &&
                    app.month === month
            );

    if(
        appointmentsToDelete.length === 0
    ){

        alert(
            "Aucun rendez-vous trouvé pour ce mois."
        );

        return;
    }

    const formattedMonth =
        `${month}/${year}`;

    const confirmed =
        confirm(
            `Supprimer définitivement les ${appointmentsToDelete.length} rendez-vous du mois ${formattedMonth} ?`
        );

    if(!confirmed){
        return;
    }

    const secondConfirm =
        confirm(
            "Cette action supprimera tous les rendez-vous de ce mois dans Firebase. Continuer ?"
        );

    if(!secondConfirm){
        return;
    }

    const updates =
        {};

    appointmentsToDelete
        .forEach(app => {

            updates[
                "bookings/" +
                app.id
            ] = null;

        });

    db.ref()
        .update(
            updates
        )
        .then(() => {

            alert(
                `${appointmentsToDelete.length} rendez-vous supprimés.`
            );

            document
                .getElementById(
                    "monthPicker"
                )
                .value = "";

            fetchAppointments();

        })
        .catch(error => {

            console.error(
                "Delete month error:",
                error
            );

            alert(
                "Erreur lors de la suppression du mois."
            );

        });
}

/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(value){

    return String(value)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );
}

/* =========================
   TABLE SCROLL
========================= */

const tableScroll =
    document.getElementById(
        "tableScroll"
    );

let touchStartX = 0;
let touchStartY = 0;

let touchStartScrollLeft = 0;
let touchStartScrollTop = 0;

let lockedAxis = null;

tableScroll.addEventListener(
    "touchstart",
    event => {

        if(
            event.touches.length !== 1
        ){
            return;
        }

        const touch =
            event.touches[0];

        touchStartX =
            touch.clientX;

        touchStartY =
            touch.clientY;

        touchStartScrollLeft =
            tableScroll.scrollLeft;

        touchStartScrollTop =
            tableScroll.scrollTop;

        lockedAxis =
            null;

    },
    {
        passive:true
    }
);

tableScroll.addEventListener(
    "touchmove",
    event => {

        if(
            event.touches.length !== 1
        ){
            return;
        }

        const touch =
            event.touches[0];

        const moveX =
            touch.clientX -
            touchStartX;

        const moveY =
            touch.clientY -
            touchStartY;

        if(!lockedAxis){

            if(
                Math.abs(moveX) < 6 &&
                Math.abs(moveY) < 6
            ){
                return;
            }

            lockedAxis =
                Math.abs(moveY) >
                Math.abs(moveX)
                ? "vertical"
                : "horizontal";
        }

        if(
            lockedAxis ===
            "vertical"
        ){

            tableScroll.scrollLeft =
                touchStartScrollLeft;

        }

        else{

            tableScroll.scrollTop =
                touchStartScrollTop;

        }

    },
    {
        passive:true
    }
);

tableScroll.addEventListener(
    "touchend",
    () => {

        lockedAxis =
            null;

    }
);

tableScroll.addEventListener(
    "touchcancel",
    () => {

        lockedAxis =
            null;

    }
);

/* =========================
   TRACKPAD / MOUSE WHEEL
========================= */

tableScroll.addEventListener(
    "wheel",
    event => {

        const horizontal =
            Math.abs(event.deltaX) >
            Math.abs(event.deltaY);

        if(horizontal){

            event.preventDefault();

            tableScroll.scrollLeft +=
                event.deltaX !== 0
                    ? event.deltaX
                    : event.deltaY;

        }

        else{

            event.preventDefault();

            tableScroll.scrollTop +=
                event.deltaY;

        }

    },
    {
        passive:false
    }
);
