<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rendez-vous clients</title>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>

<link

<style>
* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    margin: 0;
    padding: 0;
}

body {
    padding: 20px;
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    color: #222;
}

/* =========================
   CONTAINER
========================= */

.container {
    width: 100%;
    max-width: 1200px;
    margin: auto;
    padding: 25px;
    background: #fff;
    border-radius: 15px;
    box-shadow: 0 5px 25px rgba(0, 0, 0, .08);
}

/* =========================
   HEADER
========================= */

.header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
    margin-bottom: 20px;
}

.header h2 {
    margin: 0;
    font-size: 27px;
}

.back-btn {
    min-height: 44px;
    padding: 11px 16px;
    border: none;
    border-radius: 9px;
    background: #ffc107;
    color: #111;
    cursor: pointer;
    font-weight: bold;
    font-size: 14px;
    transition: .2s;
}

.back-btn:hover {
    background: #e0a800;
}

/* =========================
   COUNT
========================= */

.appointment-count {
    margin: 0 0 20px;
    color: #555;
    font-size: 17px;
}

/* =========================
   CONTROLS
========================= */

.controls {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 20px;
}

input {
    min-height: 44px;
    padding: 10px 12px;
    border: 1px solid #ddd;
    border-radius: 9px;
    outline: none;
    background: #fff;
    font-size: 14px;
}

    box-shadow: 0 0 0 3px rgba(0, 123, 255, .08);
}

#liveSearch {
    flex: 1;

}

button {
    min-height: 44px;
    padding: 9px 14px;
    border: none;
    border-radius: 9px;
    cursor: pointer;
    font-size: 14px;
    transition: .2s;
}

button:hover {

}

.refresh-btn {
    background: #28a745;
    color: #fff;
}

.delete-month-btn {
    background: #dc3545;
    color: #fff;
    font-weight: bold;
}

/* =========================
   MONTH WARNING
========================= */

    margin: 5px 0 15px;

    font-size: 12px;

}

/* =========================
   TABLE
========================= */

.table-container {

/*

    overflow-y: auto;

}

.table-scroll::-webkit-scrollbar {

}

}

thead {

.modal-overlay {

.delete-modal > p {

.modal-actions {

<body>

<div class="container">

    <div class="header">

        <button class="back-btn" onclick="goBack()">
            ← Retour au tableau de bord
        </button>

        <h2>Rendez-vous clients</h2>

    </div>

    <h3
        id="appointmentCount"
        class="appointment-count"
    >
        Total des rendez-vous : 0
    </h3>

    <div class="controls">

        <input
            type="text"
            id="liveSearch"
            placeholder="Recherche : nom, téléphone, date, barbier..."
        >

        <input
            type="month"
            id="monthPicker"
        >

        <button
            class="refresh-btn"
            onclick="fetchAppointments()"
        >
            <i class="fa-solid fa-rotate"></i>
            Actualiser
        </button>

        <button
            class="delete-month-btn"
            onclick="deleteSelectedMonth()"
        >
            <i class="fa-solid fa-calendar-xmark"></i>
            Supprimer le mois
        </button>

    </div>

    <div
        id="monthDanger"
        class="month-danger"
    ></div>

    <div class="table-container">

        <div
            class="table-scroll"
            id="tableScroll"
        >

            <table>

                <thead>
                    <tr>
                        <th>#</th>
                        <th>Nom</th>
                        <th>Mobile</th>
                        <th>Date</th>
                        <th>Heure</th>
                        <th>Barbier</th>
                        <th>Service</th>
                        <th>
                            <i class="fa-solid fa-gear"></i>
                        </th>
                    </tr>
                </thead>

                <tbody id="appointmentsBody">

                    <tr>
                        <td
                            colspan="8"
                            class="empty-row"
                        >
                            Chargement...
                        </td>
                    </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>

<!-- =========================
     DELETE MODAL
========================= -->

<div
    class="modal-overlay"
    id="deleteModal"
>

    <div class="delete-modal">

        <div class="modal-icon">
            <i class="fa-solid fa-trash-can"></i>
        </div>

        <h3>Supprimer ce rendez-vous ?</h3>

        <p>
            Voulez-vous vraiment supprimer ce rendez-vous ?
            Cette action est définitive.
        </p>

        <div class="modal-client">

            <div class="modal-client-row">
                <span>Nom</span>
                <strong id="modalName">-</strong>
            </div>

            <div class="modal-client-row">
                <span>Mobile</span>
                <strong id="modalMobile">-</strong>
            </div>

            <div class="modal-client-row">
                <span>Date</span>
                <strong id="modalDate">-</strong>
            </div>

            <div class="modal-client-row">
                <span>Heure</span>
                <strong id="modalTime">-</strong>
            </div>

        </div>

        <div class="modal-actions">

            <button
                class="modal-cancel"
                onclick="closeDeleteModal()"
            >
                <i class="fa-solid fa-xmark"></i>
                Annuler
            </button>

            <button
                class="modal-delete"
                id="confirmDeleteBtn"
                onclick="confirmDeleteAppointment()"
            >
                <i class="fa-solid fa-trash"></i>
                Supprimer
            </button>

        </div>

    </div>

</div>

<script>
/* =========================
   FIREBASE
========================= */

firebase.initializeApp({
    apiKey: "AIzaSyDtfwLl6xJxYJrgBMUGTlnyH1Ks9E5LOQs",
    authDomain: "empiresalonbarber.firebaseapp.com",
    databaseURL: "https://empiresalonbarber-default-rtdb.europe-west1.firebasedatabase.app/",
    projectId: "empiresalonbarber",
    storageBucket: "empiresalonbarber.appspot.com",
    messagingSenderId: "365303178903",
    appId: "1:365303178903:web:c6f9eb19766934e443ebd2",
    measurementId: "G-LMHTQJBCP6"
});

const db = firebase.database();

let allAppointments = [];
let pendingDeleteId = null;

/* =========================
   COUNTER
========================= */

function updateCounter(num) {
    document.getElementById("appointmentCount").innerText =
        "Total des rendez-vous : " + num;
}

/* =========================
   FETCH
========================= */

function fetchAppointments() {

    const body =
        document.getElementById("appointmentsBody");

    body.innerHTML = `
        <tr>
            <td colspan="8" class="empty-row">
                Chargement...
            </td>
        </tr>
    `;

    db.ref("bookings")
        .once("value")
        .then(snapshot => {

            if (!snapshot.exists()) {

                allAppointments = [];

                updateCounter(0);

                body.innerHTML = `
                    <tr>
                        <td colspan="8" class="empty-row">
                            Aucun rendez-vous.
                        </td>
                    </tr>
                `;

                updateMonthDeleteInfo();

                return;
            }

            const appointments = [];

            snapshot.forEach(child => {

                const data = child.val() || {};

                if (!data.date || !data.time) {
                    return;
                }

                const dateParts =
                    String(data.date).split("-");

                const timeParts =
                    String(data.time).split(":");

                if (
                    dateParts.length !== 3 ||
                    timeParts.length < 2
                ) {
                    return;
                }

                const day =
                    Number(dateParts[0]);

                const month =
                    Number(dateParts[1]);

                const year =
                    Number(dateParts[2]);

                const hour =
                    Number(timeParts[0]);

                const minute =
                    Number(timeParts[1]);

                const fullDate =
                    new Date(
                        year,
                        month - 1,
                        day,
                        hour,
                        minute
                    );

                appointments.push({
                    id: child.key,
                    username: data.username || "-",
                    mobile: data.mobile || "-",
                    date: data.date,
                    time: data.time,
                    barber: data.barber || "N/A",
                    service: data.service || "-",
                    year: String(year),
                    month: String(month).padStart(2, "0"),
                    timestamp: fullDate.getTime()
                });
            });

            appointments.sort(
                (a, b) =>
                    b.timestamp - a.timestamp
            );

            allAppointments =
                appointments;

            applyFilters();
        })
        .catch(error => {

            console.error(
                "Firebase error:",
                error
            );

            body.innerHTML = `
                <tr>
                    <td colspan="8" class="empty-row">
                        Erreur lors du chargement.
                    </td>
                </tr>
            `;
        });
}

/* =========================
   FILTERS
========================= */

function applyFilters() {

    const search =
        document
            .getElementById("liveSearch")
            .value
            .trim()
            .toLowerCase();

    const selectedMonth =
        document
            .getElementById("monthPicker")
            .value;

    let filtered =
        [...allAppointments];

    if (selectedMonth) {

        const [year, month] =
            selectedMonth.split("-");

        filtered =
            filtered.filter(app =>
                app.year === year &&
                app.month === month
            );
    }

    if (search) {

        filtered =
            filtered.filter(app => {

                const searchableText = [
                    app.username,
                    app.mobile,
                    app.date,
                    app.time,
                    app.barber,
                    app.service
                ]
                .join(" ")
                .toLowerCase();

                return searchableText.includes(search);
            });
    }

    updateCounter(filtered.length);
    renderAppointments(filtered);
    updateMonthDeleteInfo();
}

/* =========================
   RENDER TABLE
========================= */

function renderAppointments(appointments) {

    const body =
        document.getElementById("appointmentsBody");

    if (!appointments.length) {

        body.innerHTML = `
            <tr>
                <td colspan="8" class="empty-row">
                    Aucun rendez-vous trouvé.
                </td>
            </tr>
        `;

        return;
    }

    body.innerHTML =
        appointments
            .map((app, index) => `
                <tr>

                    <td>
                        ${index + 1}
                    </td>

                    <td>
                        <button
                            type="button"
                            class="name-btn"
                            data-delete-id="${escapeHTML(app.id)}"
                            title="Cliquez pour supprimer ce rendez-vous"
                        >
                            ${escapeHTML(app.username)}
                        </button>
                    </td>

                    <td title="${escapeHTML(app.mobile)}">
                        ${escapeHTML(app.mobile)}
                    </td>

                    <td>
                        ${escapeHTML(app.date)}
                    </td>

                    <td>
                        ${escapeHTML(app.time)}
                    </td>

                    <td title="${escapeHTML(app.barber)}">
                        <strong>
                            ${escapeHTML(app.barber)}
                        </strong>
                    </td>

                    <td title="${escapeHTML(app.service)}">
                        ${escapeHTML(app.service)}
                    </td>

                    <td>

                        <button
                            type="button"
                            class="delete-btn"
                            data-delete-id="${escapeHTML(app.id)}"
                            title="Supprimer"
                            aria-label="Supprimer"
                        >
                            <i class="fa-solid fa-trash"></i>
                        </button>

                    </td>

                </tr>
            `)
            .join("");
}

/* =========================
   CLICK NAME / DELETE ICON
========================= */

document
    .getElementById("appointmentsBody")
    .addEventListener("click", event => {

        const button =
            event.target.closest(
                "[data-delete-id]"
            );

        if (!button) {
            return;
        }

        const id =
            button.dataset.deleteId;

        openDeleteModal(id);
    });

/* =========================
   OPEN DELETE MODAL
========================= */

function openDeleteModal(id) {

    const appointment =
        allAppointments.find(
            app => app.id === id
        );

    if (!appointment) {
        return;
    }

    pendingDeleteId = id;

    document.getElementById("modalName").textContent =
        appointment.username;

    document.getElementById("modalMobile").textContent =
        appointment.mobile;

    document.getElementById("modalDate").textContent =
        appointment.date;

    document.getElementById("modalTime").textContent =
        appointment.time;

    document
        .getElementById("deleteModal")
        .classList.add("show");

    document.body.style.overflow =
        "hidden";
}

/* =========================
   CLOSE DELETE MODAL
========================= */

function closeDeleteModal() {

    pendingDeleteId = null;

    document
        .getElementById("deleteModal")
        .classList.remove("show");

    document.body.style.overflow =
        "";
}

/* =========================
   CONFIRM DELETE
========================= */

function confirmDeleteAppointment() {

    if (!pendingDeleteId) {
        return;
    }

    const id =
        pendingDeleteId;

    const button =
        document.getElementById(
            "confirmDeleteBtn"
        );

    button.disabled = true;

    button.innerHTML = `
        <i class="fa-solid fa-spinner fa-spin"></i>
        Suppression...
    `;

    db.ref("bookings/" + id)
        .remove()
        .then(() => {

            closeDeleteModal();

            fetchAppointments();
        })
        .catch(error => {

            console.error(
                "Delete error:",
                error
            );

            alert(
                "Une erreur est survenue lors de la suppression du rendez-vous."
            );
        })
        .finally(() => {

            button.disabled = false;

            button.innerHTML = `
                <i class="fa-solid fa-trash"></i>
                Supprimer
            `;
        });
}

/* =========================
   CLOSE MODAL BY BACKGROUND
========================= */

document
    .getElementById("deleteModal")
    .addEventListener("click", event => {

        if (
            event.target.id ===
            "deleteModal"
        ) {
            closeDeleteModal();
        }
    });

/* =========================
   ESC KEY
========================= */

document.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Escape" &&
            document
                .getElementById("deleteModal")
                .classList
                .contains("show")
        ) {
            closeDeleteModal();
        }
    }
);

/* =========================
   MONTH INFO
========================= */

function updateMonthDeleteInfo() {

    const selectedMonth =
        document
            .getElementById("monthPicker")
            .value;

    const box =
        document.getElementById(
            "monthDanger"
        );

    if (!selectedMonth) {

        box.classList.remove("show");
        box.innerHTML = "";

        return;
    }

    const [year, month] =
        selectedMonth.split("-");

    const count =
        allAppointments.filter(app =>
            app.year === year &&
            app.month === month
        ).length;

    box.innerHTML = `
        Le mois sélectionné contient
        <strong>${count}</strong>
        rendez-vous.
        Le bouton « Supprimer le mois »
        supprimera définitivement
        ces rendez-vous de Firebase.
    `;

    box.classList.add("show");
}

/* =========================
   DELETE MONTH
========================= */

function deleteSelectedMonth() {

    const selectedMonth =
        document
            .getElementById("monthPicker")
            .value;

    if (!selectedMonth) {

        alert(
            "Veuillez d'abord sélectionner un mois."
        );

        return;
    }

    const [year, month] =
        selectedMonth.split("-");

    const appointmentsToDelete =
        allAppointments.filter(app =>
            app.year === year &&
            app.month === month
        );

    if (!appointmentsToDelete.length) {

        alert(
            "Aucun rendez-vous trouvé pour ce mois."
        );

        return;
    }

    const formattedMonth =
        `${month}/${year}`;

    const confirmed =
        confirm(
            `Supprimer définitivement les ${appointmentsToDelete.length} rendez-vous du mois ${formattedMonth} ?`
        );

    if (!confirmed) {
        return;
    }

    const secondConfirm =
        confirm(
            "Cette action supprimera tous les rendez-vous de ce mois dans Firebase. Continuer ?"
        );

    if (!secondConfirm) {
        return;
    }

    const updates = {};

    appointmentsToDelete.forEach(app => {
        updates[
            "bookings/" + app.id
        ] = null;
    });

    db.ref()
        .update(updates)
        .then(() => {

            alert(
                `${appointmentsToDelete.length} rendez-vous supprimés.`
            );

            document
                .getElementById("monthPicker")
                .value = "";

            fetchAppointments();
        })
        .catch(error => {

            console.error(
                "Delete month error:",
                error
            );

            alert(
                "Erreur lors de la suppression du mois."
            );
        });
}

/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(value) {

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

/* =========================================================
   SCROLL DIRECTION LOCK
=========================================================

   Vertical:
   finger moves up/down
   ONLY tableScroll.scrollTop changes.

   Horizontal:
   finger moves left/right
   ONLY tableScroll.scrollLeft changes.

   This prevents diagonal scrolling.
========================================================= */

const tableScroll =
    document.getElementById(
        "tableScroll"
    );

let startX = 0;
let startY = 0;

let startScrollLeft = 0;
let startScrollTop = 0;

let scrollAxis = null;

const AXIS_THRESHOLD = 7;

/* =========================
   TOUCH START
========================= */

tableScroll.addEventListener(
    "touchstart",
    event => {

        if (event.touches.length !== 1) {
            return;
        }

        const touch =
            event.touches[0];

        startX =
            touch.clientX;

        startY =
            touch.clientY;

        startScrollLeft =
            tableScroll.scrollLeft;

        startScrollTop =
            tableScroll.scrollTop;

        scrollAxis = null;
    },
    {
        passive: true
    }
);

/* =========================
   TOUCH MOVE
========================= */

tableScroll.addEventListener(
    "touchmove",
    event => {

        if (event.touches.length !== 1) {
            return;
        }

        const touch =
            event.touches[0];

        const deltaX =
            touch.clientX - startX;

        const deltaY =
            touch.clientY - startY;

        /*
            Wait a little before deciding
            which direction the user wants.
        */

        if (!scrollAxis) {

            if (
                Math.abs(deltaX) <
                    AXIS_THRESHOLD &&
                Math.abs(deltaY) <
                    AXIS_THRESHOLD
            ) {
                return;
            }

            if (
                Math.abs(deltaY) >
                Math.abs(deltaX)
            ) {
                scrollAxis =
                    "vertical";
            } else {
                scrollAxis =
                    "horizontal";
            }
        }

        /*
            Stop browser's diagonal
            scrolling behavior.
        */

        event.preventDefault();

        /* VERTICAL ONLY */

        if (
            scrollAxis ===
            "vertical"
        ) {

            tableScroll.scrollTop =
                startScrollTop -
                deltaY;

            tableScroll.scrollLeft =
                startScrollLeft;
        }

        /* HORIZONTAL ONLY */

        else {

            tableScroll.scrollLeft =
                startScrollLeft -
                deltaX;

            tableScroll.scrollTop =
                startScrollTop;
        }
    },
    {
        passive: false
    }
);

/* =========================
   TOUCH END
========================= */

function resetScrollAxis() {
    scrollAxis = null;
}

tableScroll.addEventListener(
    "touchend",
    resetScrollAxis
);

tableScroll.addEventListener(
    "touchcancel",
    resetScrollAxis
);

/* =========================
   TRACKPAD / MOUSE WHEEL
========================= */

tableScroll.addEventListener(
    "wheel",
    event => {

        /*
            Detect the strongest direction.
        */

        const isHorizontal =
            Math.abs(event.deltaX) >
            Math.abs(event.deltaY);

        /*
            HORIZONTAL
        */

        if (isHorizontal) {

            event.preventDefault();

            tableScroll.scrollLeft +=
                event.deltaX;

            return;
        }

        /*
            VERTICAL
        */

        if (event.deltaY !== 0) {

            event.preventDefault();

            tableScroll.scrollTop +=
                event.deltaY;
        }
    },
    {
        passive: false
    }
);

/* =========================
   EVENTS
========================= */

document
    .getElementById("liveSearch")
    .addEventListener(
        "input",
        applyFilters
    );

document
    .getElementById("monthPicker")
    .addEventListener(
        "change",
        applyFilters
    );

document.addEventListener(
    "DOMContentLoaded",
    fetchAppointments
);

}
